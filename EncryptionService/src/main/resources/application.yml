server:
  port: 8081
  # Uncomment to enable SSL (see SSL.md for keystore setup)
  # port: 8443
  # ssl:
  #   key-store: classpath:keystore.p12
  #   key-store-type: PKCS12
  #   key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
  #   key-alias: encryption-service
  #   enabled: true

app:
  vault:
    url: ${VAULT_URL:http://localhost:8200}
    namespace:
    role-id: ${VAULT_ROLE_ID:your-role-id}
    secret-id: ${VAULT_SECRET_ID:your-secret-id}
    auth-mount-path: ${VAULT_AUTH_MOUNT_PATH:approle}
    transit-mount-path: ${VAULT_TRANSIT_MOUNT_PATH:transit}
    kv-mount-path: ${VAULT_KV_MOUNT_PATH:secret}
    transit-key: my-key
    read-timeout: 5s

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://your-idp.example.com}
          jwk-set-uri: ${JWT_JWK_SET_URI:https://your-idp.example.com/.well-known/jwks.json}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
      file-size-threshold: 1MB

staging:
  dir: /tmp/encryption-staging

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      connect-timeout: 1s
      read-timeout: 2s
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      percentiles:
        # Query: GET /actuator/metrics/http.server.requests.percentile?tag=phi:0.95&tag=uri:/api/v1/file/encrypt
        # Query: GET /actuator/metrics/vault.ops.latency.percentile?tag=phi:0.99
        # Query: GET /actuator/metrics/file.stage.latency.percentile?tag=phi:0.99&tag=operation:encrypt
        # Query: GET /actuator/metrics/file.cipher.latency.percentile?tag=phi:0.99&tag=operation:encrypt
        # Query: GET /actuator/metrics/file.stream.latency.percentile?tag=phi:0.99&tag=operation:encrypt
        "[vault.ops.latency]": 0.5,0.95,0.99
        "[http.server.requests]": 0.5,0.95,0.99
        "[file.stage.latency]": 0.5,0.95,0.99
        "[file.cipher.latency]": 0.5,0.95,0.99
        "[file.stream.latency]": 0.5,0.95,0.99

resilience4j:
  bulkhead:
    instances:
      cipherOps:
        # Semaphore bulkhead: limits concurrent doFinal() calls to bound heap usage (~2 MB per op)
        maxConcurrentCalls: 10
        maxWaitDuration: 0ms   # fail-fast — no queuing; caller gets BulkheadFullException immediately

# GC logging — add to JVM args at startup:
# -Xlog:gc*:file=c:/tm/gc.log:time,uptime:filecount=3,filesize=10m

logging:
  level:
    com.example.encryption.config.VaultConfig: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

