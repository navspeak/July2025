server:
  port: 8081

app:
  vault:
    url: ${VAULT_URL:http://localhost:8200}
    namespace: ${VAULT_NAMESPACE:harness/myproj}
    role-id: ${VAULT_ROLE_ID:your-role-id}
    secret-id: ${VAULT_SECRET_ID:your-secret-id}
    auth-mount-path: ${VAULT_AUTH_MOUNT_PATH:approle}
    transit-mount-path: transit
    kv-mount-path: secret
    transit-key: my-key
    read-timeout: 5s

spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
      file-size-threshold: 1MB


staging:
  dir: /tmp/encryption-staging

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,traces

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yml
  api-docs:
    enabled: false
