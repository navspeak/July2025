server:
  port: 8081

app:
  vault:
    url: ${VAULT_URL:http://localhost:8200}
    role-id: ${VAULT_ROLE_ID:your-role-id}
    secret-id: ${VAULT_SECRET_ID:your-secret-id}
    mount-path: transit
    key-name: my-key

spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
      file-size-threshold: 1MB


staging:
  dir: /tmp/encryption-staging
  cleanup:
    max-age-minutes: 60
    interval-ms: 3600000

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,traces

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yml
  api-docs:
    enabled: false
