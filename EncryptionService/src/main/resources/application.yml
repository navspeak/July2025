server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEYSTORE_PATH:classpath:keystore.p12}
    key-store-type: PKCS12
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeit}
    key-alias: ${SSL_KEY_ALIAS:encryption-service}

app:
  vault:
    url: ${VAULT_URL:http://localhost:8200}
    namespace:
    role-id: ${VAULT_ROLE_ID:your-role-id}
    secret-id: ${VAULT_SECRET_ID:your-secret-id}
    auth-mount-path: ${VAULT_AUTH_MOUNT_PATH:approle}
    transit-mount-path: ${VAULT_TRANSIT_MOUNT_PATH:transit}
    kv-mount-path: ${VAULT_KV_MOUNT_PATH:secret}
    transit-key: my-key
    read-timeout: 5s

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          # Local Keycloak (docker/keycloak):
          #   issuer-uri  : http://localhost:8080/realms/encryption
          #   jwk-set-uri : http://localhost:8080/realms/encryption/protocol/openid-connect/certs
          #   audiences   : encryption-service
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/encryption}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/encryption/protocol/openid-connect/certs}
          audiences: ${JWT_AUDIENCE:encryption-service}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 31MB
      file-size-threshold: 30MB

staging:
  dir: /tmp/encryption-staging

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      connect-timeout: 1s
      read-timeout: 2s
    metrics:
      export:
        enabled: false
  metrics:
    distribution:
      percentiles:
        # Query: GET /actuator/metrics/http.server.requests.percentile?tag=phi:0.95&tag=uri:/api/v1/file/encrypt
        # Query: GET /actuator/metrics/vault.ops.latency.percentile?tag=phi:0.99
        # Query: GET /actuator/metrics/file.stage.latency.percentile?tag=phi:0.99&tag=operation:encrypt
        # Query: GET /actuator/metrics/file.cipher.latency.percentile?tag=phi:0.99&tag=operation:encrypt
        # Query: GET /actuator/metrics/file.stream.latency.percentile?tag=phi:0.99&tag=operation:encrypt
        "[vault.ops.latency]": 0.5,0.95,0.99
        "[http.server.requests]": 0.5,0.95,0.99
        "[file.stage.latency]": 0.5,0.95,0.99
        "[file.cipher.latency]": 0.5,0.95,0.99
        "[file.stream.latency]": 0.5,0.95,0.99

resilience4j:
  bulkhead:
    instances:
      cipherOps:
        # Small files (≤ 1 MB): up to 50 concurrent; worst-case heap is 50 × 2 MB = 100 MB (safe with -Xmx3g)
        maxConcurrentCalls: 50
        maxWaitDuration: 0ms   # fail-fast — no queuing; caller gets BulkheadFullException immediately
      cipherOpsLarge:
        # Large files (> 1 MB): capped at 3 to bound heap (~3 × 60 MB = 180 MB peak at 30 MB max)
        maxConcurrentCalls: 3
        maxWaitDuration: 0ms

# GC logging — add to JVM args at startup:
# -Xlog:gc*:file=c:/tm/gc.log:time,uptime:filecount=3,filesize=10m

logging:
  level:
    com.example.encryption.config.VaultConfig: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

