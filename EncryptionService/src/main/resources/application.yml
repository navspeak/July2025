server:
  port: 8081

spring:
  vault:
    uri: http://localhost:8200
    authentication: APPROLE
    app-role:
      role-id: ${VAULT_ROLE_ID:your-role-id}
      secret-id: ${VAULT_SECRET_ID:your-secret-id}
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
      file-size-threshold: 1MB

vault:
  transit-key: my-key
  kv-path: secret/encryption/config

staging:
  dir: /tmp/encryption-staging
  cleanup:
    max-age-minutes: 60
    interval-ms: 3600000

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,metrics,traces

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
